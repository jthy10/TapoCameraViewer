name: build

# Builds standalone executables and attaches them to the release.
# Can also be run by hand from the Actions tab (the builds show up as artifacts).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: TapoCameraViewer-windows.exe
            out: dist/TapoCameraViewer.exe
          - os: ubuntu-22.04  # older glibc so the binary runs on more distros
            asset: TapoCameraViewer-linux
            out: dist/TapoCameraViewer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build
        run: >
          pyinstaller --noconfirm --onefile --name TapoCameraViewer
          --add-data "index.html:."
          --collect-all imageio_ffmpeg
          --collect-submodules keyring --copy-metadata keyring
          --collect-submodules pytapo
          tapo_camera_viewer.py

      - name: Rename
        shell: bash
        run: mv "${{ matrix.out }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.asset }}" --clobber
